<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
  <meta name="description" content="点迹：在手机上记录经纬度单点与轨迹，支持间隔采样、GPX/KML/GeoJSON/CSV 导出，数据只保存在本机。">
  <title>点迹 · GPS 经纬记录</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="点迹">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#/locate" aria-label="点迹首页">
      <img class="brand-mark" src="./icons/favicon.svg" alt="" width="30" height="30">
      <span class="brand-name">点迹</span>
    </a>
    <button id="btn-settings" class="icon-btn" type="button" aria-label="设置">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <div id="banner-stack" class="banner-stack" aria-live="polite"></div>
  <main id="app" class="app-main"></main>

  <nav class="tabbar" aria-label="主导航">
    <a class="tab" href="#/locate" data-tab="locate">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="7"></circle>
        <circle cx="12" cy="12" r="2"></circle>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
      </svg>
      <span>定位</span>
    </a>
    <a class="tab" href="#/record" data-tab="record">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 18l4-4 3 2 5-7 4 2"></path>
        <circle cx="4" cy="18" r="1.6"></circle>
        <circle cx="20" cy="11" r="1.6"></circle>
      </svg>
      <span>轨迹</span>
    </a>
    <a class="tab" href="#/saved" data-tab="saved">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"></path>
      </svg>
      <span>记录</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./vendor/leaflet/leaflet.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
